# Lunch app + PostgreSQL + ngrok tunnel. Start: docker compose up -d --build
# Settings come from .env (copy .env.example). Required ones stop `up` with a message when missing.

services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: lunch
      POSTGRES_USER: lunch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - lunch-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunch -d lunch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: lunch-app:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lunch
      SPRING_DATASOURCE_USERNAME: lunch
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      LUNCH_ADMIN_USERNAME: ${LUNCH_ADMIN_USERNAME:-admin}
      LUNCH_ADMIN_PASSWORD_HASH: ${LUNCH_ADMIN_PASSWORD_HASH:?set LUNCH_ADMIN_PASSWORD_HASH in .env (single quotes)}
      LUNCH_TEAMS_SECURITY_TOKEN: ${LUNCH_TEAMS_SECURITY_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LUNCH_TIME_ZONE: ${LUNCH_TIME_ZONE:-Europe/Brussels}
      JAVA_TOOL_OPTIONS: -Xmx256m
    restart: unless-stopped

  tunnel:
    image: ngrok/ngrok:3.39.13-alpine
    command: ["http", "app:8080", "--url=${NGROK_DOMAIN:?set NGROK_DOMAIN in .env}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  lunch-db: {}
